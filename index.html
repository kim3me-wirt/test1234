<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Interactive Gallery | test1234</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #f2f1ed; color: #171717; font-family: Inter, Pretendard, Arial, sans-serif; }
      body { min-height: 100vh; }
      .gallery-shell { min-height: 100vh; display: flex; flex-direction: column; }
      .gallery-header { height: 76px; padding: 0 42px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,.12); background: rgba(242,241,237,.9); }
      .brand { font-size: 15px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      .gallery-nav { display:flex; gap: 26px; font-size: 12px; letter-spacing:.08em; color:#777; }
      .gallery-main { flex: 1; display:grid; grid-template-columns: 230px minmax(0, 1fr); gap: 46px; padding: 42px; }
      .gallery-info { display:flex; flex-direction:column; justify-content:space-between; padding: 6px 0 14px; }
      .eyebrow { font-size:11px; color:#8c8c88; letter-spacing:.18em; text-transform:uppercase; margin-bottom:16px; }
      .gallery-info h1 { margin:0; font-size:30px; line-height:1.05; font-weight:500; letter-spacing:-.04em; }
      .description { margin-top:18px; max-width:190px; color:#777; font-size:13px; line-height:1.7; }
      .meta { border-top:1px solid rgba(0,0,0,.14); padding-top:16px; color:#777; font-size:11px; line-height:1.9; letter-spacing:.04em; }
      .art-stage { min-width:0; display:flex; align-items:center; justify-content:center; }
      .art-frame { width:min(100%, 1180px); background:#fff; padding:18px; box-shadow:0 26px 70px rgba(0,0,0,.12); }
      #unity-container.unity-desktop { position:relative !important; left:auto !important; top:auto !important; transform:none !important; width:100% !important; height:auto !important; background:#111; overflow:hidden; }
      #unity-canvas { display:block; width:100% !important; height:auto !important; aspect-ratio: 16 / 10; background:#111; }
      #unity-footer { background:#fff; height:42px; display:flex; align-items:center; }
      #unity-logo-title-footer { display:none; }
      #unity-build-title { color:#777; font-size:11px; letter-spacing:.08em; }
      #unity-fullscreen-button { margin-left:auto; }
      #unity-loading-bar { z-index:5; }
      .gallery-footer { height:58px; padding:0 42px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid rgba(0,0,0,.12); color:#888; font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
      @media (max-width: 900px) {
        html, body { width:100%; overflow-x:hidden; }
        .gallery-header { height:62px; padding:0 max(18px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left)); }
        .brand { font-size:12px; letter-spacing:.13em; }
        .gallery-nav { display:none; }
        .gallery-main { display:flex; flex-direction:column; width:100%; padding:24px 16px 30px; gap:22px; }
        .gallery-info { display:block; padding:0 2px; }
        .eyebrow { margin-bottom:10px; font-size:10px; }
        .gallery-info h1 { font-size:clamp(28px, 9vw, 42px); line-height:1; }
        .description { max-width:520px; margin-top:14px; font-size:12px; line-height:1.65; }
        .meta { margin-top:20px; padding-top:12px; font-size:10px; }
        .art-stage { width:100%; min-width:0; display:block; }
        .art-frame { width:100%; max-width:100%; padding:6px; box-shadow:0 14px 36px rgba(0,0,0,.11); overflow:hidden; }
        #unity-container, #unity-container.unity-mobile, #unity-container.unity-desktop { position:relative !important; inset:auto !important; width:100% !important; height:auto !important; min-height:0 !important; transform:none !important; overflow:hidden !important; background:#111; }
        #unity-canvas, #unity-canvas.unity-mobile { position:relative !important; inset:auto !important; display:block !important; width:100% !important; height:auto !important; max-width:100% !important; aspect-ratio:16 / 10; transform:none !important; }
        #unity-footer { display:flex !important; width:100%; height:38px; padding:0 8px; }
        #unity-build-title { font-size:9px; }
        #unity-fullscreen-button { flex:0 0 auto; }
        #unity-loading-bar { max-width:90%; }
        #unity-warning { width:100%; font-size:11px; }
        .gallery-footer { min-height:52px; height:auto; padding:16px 18px calc(16px + env(safe-area-inset-bottom)); gap:12px; flex-wrap:wrap; }
      }
      @media (max-width: 480px) {
        .gallery-main { padding-left:12px; padding-right:12px; }
        .art-frame { padding:4px; }
        .gallery-footer { font-size:9px; }
      }
      @media (orientation: landscape) and (max-height: 520px) {
        .gallery-header { height:50px; }
        .gallery-main { padding-top:14px; }
        .gallery-info h1 { font-size:26px; }
        .description, .meta { display:none; }
      }
    </style>
  </head>
  <body>
    <div class="gallery-shell">
      <header class="gallery-header">
        <div class="brand">Digital Exhibition</div>
        <nav class="gallery-nav"><span>Interactive Work</span><span>WebGL / 2026</span></nav>
      </header>
      <main class="gallery-main">
        <aside class="gallery-info">
          <div>
            <div class="eyebrow">Exhibition 01</div>
            <h1>Interactive<br>Space</h1>
            <p class="description">A real-time interactive experience presented as a digital gallery piece. Explore the scene directly in your browser.</p>
          </div>
          <div class="meta">TITLE — test1234<br>TYPE — Unity WebGL<br>VERSION — 0.1.0</div>
        </aside>
        <section class="art-stage">
          <div class="art-frame">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">test1234</div>
      </div>
    </div>
          </div>
        </section>
      </main>
      <footer class="gallery-footer"><span>Digital Gallery</span><span>Interactive Experience</span></footer>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/build.data.br",
        frameworkUrl: buildUrl + "/build.framework.js.br",
        codeUrl: buildUrl + "/build.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "test1234",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        canvas.style.width = "100%";
        canvas.style.height = "auto";
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "100%";
        canvas.style.height = "auto";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
